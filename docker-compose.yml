services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: event_photos_api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=host.docker.internal
      - POSTGRES_PORT=5432
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      - storage_data:/app/storage
      - ./models_zoo:/app/models_zoo
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: event_photos_worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=host.docker.internal
      - POSTGRES_PORT=5432
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      - storage_data:/app/storage
      - ./models_zoo:/app/models_zoo
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M

  nginx:
    image: nginx:alpine
    container_name: event_photos_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

volumes:
  storage_data:
