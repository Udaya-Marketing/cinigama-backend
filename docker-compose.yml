services:
  db:
    image: pgvector/pgvector:pg16
    container_name: event_photos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-event_photos}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-event_photos}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 1024M

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: event_photos_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=${POSTGRES_SERVER:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      - storage_data:/app/storage
      - ./models_zoo:/app/models_zoo
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: event_photos_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=${POSTGRES_SERVER:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      - storage_data:/app/storage
      - ./models_zoo:/app/models_zoo
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M

  nginx:
    image: nginx:alpine
    container_name: event_photos_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

volumes:
  postgres_data:
  storage_data:

